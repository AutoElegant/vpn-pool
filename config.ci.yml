# ─────────────── Бот ───────────────
bot:
  cooldown_seconds: 10        # пауза между выдачами конфига одному юзеру

  # Антифлуд: отбивает лишние апдейты ещё до обработчиков.
  # rate — действий в секунду в среднем, burst — сколько можно разом.
  throttle_rate: 1.0
  throttle_burst: 4
  throttle_strikes: 8         # отбитых подряд, после которых замолкаем
  throttle_ban_seconds: 60
  daily_limit: 40             # лимит конфигов на юзера в сутки (0 = без лимита)
  send_qr: true               # присылать QR-код (Happ умеет сканировать)
  broadcast_rate: 20          # сообщений в секунду при рассылке
