    url: https://raw.githubusercontent.com/lilyungcykamane/vless-checker/main/top100.txt
  - name: lilyung-good
    priority: 95
    url: https://raw.githubusercontent.com/lilyungcykamane/vless-checker/main/good.txt
  - name: luxxuria-speed
    priority: 90
    url: https://raw.githubusercontent.com/luxxuria/harvester/main/speed_tested.txt
  - name: luxxuria-top600
    priority: 85
    url: https://raw.githubusercontent.com/luxxuria/harvester/main/top_600.txt
  - name: flarefeed-fastest
    priority: 90
    url: https://raw.githubusercontent.com/svinakraft-maker/FlareFeed/main/public/fastest.txt
  - name: flarefeed-vless
    priority: 85
