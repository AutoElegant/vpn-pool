name: Сбор и проверка конфигов

on:
  schedule:
    - cron: "7 * * * *"      # каждый час в :07
  workflow_dispatch:          # и вручную с вкладки Actions
  push:                       # и при изменении логики проверки
    branches: [main]
    paths:
      - "core/**"
      - "config.ci.yml"
      - ".github/workflows/collect.yml"

permissions:
  contents: write             # чтобы коммитить обновлённый пул

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: pip install -q -r requirements.txt

      - name: Ставим xray-core
        run: |
          curl -fsSL -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -qo xray.zip xray
          sudo install -m 0755 xray /usr/local/bin/xray
          xray version | head -1

      - name: Сбор и проверка
        env:
          VPN_CONFIG: config.ci.yml     # на раннере проверяем агрессивнее
        run: python -m core.collector --state data/pool.json -v

      - name: Публикуем пул
        run: |
          if git diff --quiet -- data/pool.json; then
            echo "Пул не изменился"
            exit 0
          fi
          POOL=$(python -c "import json;d=json.load(open('data/pool.json'));print(len(d['pool']))")
          RU=$(python -c "import json;d=json.load(open('data/pool.json'));print(sum(1 for c in d['pool'] if (c.get('ru_nodes') or 0) > 0))")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pool.json
          git commit -m "пул: $POOL рабочих, из них $RU доступны из РФ"
          git push

      - name: Итог
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          f = pathlib.Path("data/pool.json")
          if not f.exists():
              print("### Пул не собрался"); raise SystemExit
          d = json.loads(f.read_text())
          pool = d["pool"]
          ru = [c for c in pool if (c.get("ru_nodes") or 0) > 0]
          countries = {c.get("country") for c in pool if c.get("country")}
          print("## Результат прохода\n")
          print(f"- В пуле: **{len(pool)}**")
          print(f"- Доступны из РФ: **{len(ru)}**")
          print(f"- Стран: **{len(countries)}**")
          print(f"- Чёрный список: {len(d.get('deadlist', {}))}")
          PY
